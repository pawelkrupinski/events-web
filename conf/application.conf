include "local"

play.http.secret.key=${?APPLICATION_SECRET}

play.filters.hosts {
  allowed = [".conscious-events.herokuapp.com", "localhost:9000", "localhost:9001"]
}

mongodb.uri="mongodb+srv://"${MONGO_USERNAME}":"${MONGO_PASSWORD}"@"${MONGO_URL}"/"${MONGO_DATABASE}"?retryWrites=true&w=majority"
# Local/dev override: if MONGO_URI is set (e.g. in local.conf), it wins over the Atlas SRV uri above.
mongodb.uri=${?MONGO_URI}
